# Runs the test suite (fake WoW environment through lupa) on every push and pull request.
name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Run tests
        run: |
          set -e
          for t in tests/test_*.py; do echo "== $t"; python "$t"; done
